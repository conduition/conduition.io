<svg xmlns="http://www.w3.org/2000/svg" width="900" height="820" viewBox="0 0 900 820" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="900" height="820" fill="#2b2f36"/>

  <!-- Definitions -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9aa4b2"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f2b134"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="34" fill="#e8ecf1" font-size="21" font-weight="700" text-anchor="middle">Commitment H(w, m) Anchored in a Block Header</text>

  <!-- ================= BLOCK HEADER ================= -->
  <rect x="270" y="60" width="360" height="90" rx="8" fill="#343a44" stroke="#7fd1ae" stroke-width="2"/>
  <text x="450" y="84" fill="#7fd1ae" font-size="15" font-weight="700" text-anchor="middle">BLOCK HEADER</text>
  <text x="290" y="108" fill="#c7cdd6" font-size="12">prev_hash • version • time • bits • nonce</text>
  <rect x="290" y="118" width="320" height="24" rx="4" fill="#3f4a44" stroke="#7fd1ae" stroke-width="1.5"/>
  <text x="450" y="135" fill="#7fd1ae" font-size="12.5" font-weight="600" text-anchor="middle">merkle_root  ←  commits to all txs</text>

  <line x2="450" y2="150" x1="450" y1="180" stroke="#9aa4b2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= MERKLE ROOT ================= -->
  <rect x="380" y="182" width="140" height="40" rx="6" fill="#3a4048" stroke="#9aa4b2" stroke-width="1.5"/>
  <text x="450" y="200" fill="#e8ecf1" font-size="13" font-weight="600" text-anchor="middle">Merkle Root</text>
  <text x="450" y="215" fill="#9aa4b2" font-size="11" text-anchor="middle">H(H01 ‖ H23)</text>

  <!-- Merkle level 2 branches -->
  <line x2="410" y2="222" x1="250" y1="262" stroke="#9aa4b2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x2="490" y2="222" x1="650" y1="262" stroke="#f2b134" stroke-width="1.5" marker-end="url(#arrowGold)"/>

  <!-- Internal nodes H01 / H23 -->
  <rect x="185" y="264" width="130" height="38" rx="6" fill="#3a4048" stroke="#f2b134" stroke-width="1.5"/>
  <text x="250" y="281" fill="#f2b134" font-size="12.5" font-weight="600" text-anchor="middle">H01</text>
  <text x="250" y="295" fill="#f2d38a" font-size="10.5" text-anchor="middle">H(H0 ‖ H1)</text>

  <rect x="585" y="264" width="130" height="38" rx="6" fill="#3a4048" stroke="#9aa4b2" stroke-width="2"/>
  <text x="650" y="281" fill="#e8ecf1" font-size="12.5" font-weight="600" text-anchor="middle">H23</text>
  <text x="650" y="295" fill="#9aa4b2" font-size="10.5" text-anchor="middle">H(H2 ‖ H3)</text>

  <!-- highlight the authenticated path -->
  <line x2="450" y2="222" x1="490" y1="222" stroke="#f2b134" stroke-width="0" />

  <!-- level 1 branches -->
  <line x2="215" y2="302" x1="150" y1="342" stroke="#9aa4b2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x2="285" y2="302" x1="350" y1="342" stroke="#9aa4b2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x2="615" y2="302" x1="550" y1="342" stroke="#9aa4b2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x2="685" y2="302" x1="750" y1="342" stroke="#f2b134" stroke-width="2" marker-end="url(#arrowGold)"/>

  <!-- Leaf hashes -->
  <g font-size="12" font-weight="600" text-anchor="middle">
    <rect x="95"  y="344" width="110" height="34" rx="6" fill="#3a4048" stroke="#9aa4b2" stroke-width="1.5"/>
    <text x="150" y="365" fill="#e8ecf1">H0 = H(tx0)</text>

    <rect x="295" y="344" width="110" height="34" rx="6" fill="#3a4048" stroke="#9aa4b2" stroke-width="1.5"/>
    <text x="350" y="365" fill="#e8ecf1">H1 = H(tx1)</text>

    <rect x="495" y="344" width="110" height="34" rx="6" fill="#3a4048" stroke="#f2b134" stroke-width="1.5"/>
    <text x="550" y="365" fill="#f2b134">H2 = H(tx2)</text>

    <rect x="695" y="344" width="110" height="34" rx="6" fill="#3a4048" stroke="#9aa4b2" stroke-width="2"/>
    <text x="750" y="365" fill="#e8ecf1">H3 = H(tx3)</text>
  </g>

  <!-- leaf to tx arrows -->
  <line x2="150" y2="378" x1="150" y1="404" stroke="#9aa4b2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x2="350" y2="378" x1="350" y1="404" stroke="#9aa4b2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x2="550" y2="378" x1="550" y1="404" stroke="#9aa4b2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x2="750" y2="378" x1="750" y1="404" stroke="#f2b134" stroke-width="2" marker-end="url(#arrowGold)"/>

  <!-- Transactions -->
  <g font-size="12" text-anchor="middle">
    <rect x="110" y="406" width="80" height="30" rx="5" fill="#333944" stroke="#9aa4b2" stroke-width="1.2"/>
    <text x="150" y="425" fill="#c7cdd6">tx0</text>
    <rect x="310" y="406" width="80" height="30" rx="5" fill="#333944" stroke="#9aa4b2" stroke-width="1.2"/>
    <text x="350" y="425" fill="#c7cdd6">tx1</text>
    <rect x="510" y="406" width="80" height="30" rx="5" fill="#333944" stroke="#9aa4b2" stroke-width="1.2"/>
    <text x="550" y="425" fill="#c7cdd6">tx2</text>
  </g>

  <!-- Highlighted TX3 (contains OP_RETURN) -->
  <rect x="640" y="406" width="220" height="150" rx="8" fill="#3a3325" stroke="#f2b134" stroke-width="2.5"/>
  <text x="750" y="426" fill="#f2b134" font-size="13.5" font-weight="700" text-anchor="middle">tx3  (our transaction)</text>

  <rect x="656" y="436" width="90" height="34" rx="4" fill="#333944" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="701" y="457" fill="#c7cdd6" font-size="11.5" text-anchor="middle">input(s)</text>

  <rect x="754" y="436" width="90" height="34" rx="4" fill="#333944" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="799" y="452" fill="#c7cdd6" font-size="11.5" text-anchor="middle">output 0</text>
  <text x="799" y="465" fill="#8f97a3" font-size="10" text-anchor="middle">(value / change)</text>

  <!-- OP_RETURN output -->
  <rect x="656" y="478" width="188" height="64" rx="5" fill="#2f3a44" stroke="#4fb3e8" stroke-width="2"/>
  <text x="750" y="496" fill="#4fb3e8" font-size="12" font-weight="700" text-anchor="middle">output 1 — scriptPubKey</text>
  <text x="750" y="513" fill="#e8ecf1" font-size="12" text-anchor="middle" font-family="Consolas, monospace">OP_RETURN &lt;commitment&gt;</text>
  <rect x="672" y="520" width="156" height="18" rx="3" fill="#274050" stroke="#4fb3e8" stroke-width="1.2"/>
  <text x="750" y="533" fill="#7fd1ff" font-size="11.5" font-weight="700" text-anchor="middle" font-family="Consolas, monospace">commitment = H(w, m)</text>

  <!-- Arrow from commitment box down to reveal -->
  <line x2="750" y2="556" x1="750" y1="600" stroke="#4fb3e8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= COMMITMENT / REVEAL PANEL ================= -->
  <rect x="60" y="600" width="780" height="185" rx="10" fill="#30353d" stroke="#4a515b" stroke-width="1.5"/>
  <text x="450" y="626" fill="#e8ecf1" font-size="15" font-weight="700" text-anchor="middle">Commit / Reveal Scheme</text>

  <!-- COMMIT box -->
  <rect x="90" y="642" width="345" height="120" rx="8" fill="#2f3a44" stroke="#4fb3e8" stroke-width="1.8"/>
  <text x="262" y="664" fill="#4fb3e8" font-size="13" font-weight="700" text-anchor="middle">1. COMMIT  (on-chain, in OP_RETURN)</text>
  <text x="110" y="690" fill="#c7cdd6" font-size="12.5" font-family="Consolas, monospace">commitment = H(w, m)</text>
  <text x="130" y="710" fill="#8f97a3" font-size="11.5">w = secret witness</text>
  <text x="130" y="728" fill="#8f97a3" font-size="11.5">m = committed message</text>
  <text x="110" y="750" fill="#7fd1ff" font-size="11.5">Only commitment is published → m and w stay hidden</text>

  <!-- REVEAL box -->
  <rect x="465" y="642" width="345" height="120" rx="8" fill="#2f3a3a" stroke="#7fd1ae" stroke-width="1.8"/>
  <text x="637" y="664" fill="#7fd1ae" font-size="13" font-weight="700" text-anchor="middle">2. REVEAL  (later)</text>
  <text x="485" y="690" fill="#c7cdd6" font-size="12.5" font-family="Consolas, monospace">reveal (w, m)</text>
  <text x="485" y="712" fill="#c7cdd6" font-size="12.5" font-family="Consolas, monospace">verify: H(w, m) == commitment</text>
  <text x="485" y="734" fill="#8f97a3" font-size="11.5">Binding: commitment fixed, m cannot change</text>
  <text x="485" y="752" fill="#8f97a3" font-size="11.5">Hiding: prevents guessing witness early</text>

  <!-- Side note: authenticated path -->
  <text x="450" y="235" fill="#f2b134" font-size="0"></text>

  <!-- Legend for gold path -->
  <rect x="60" y="70" width="190" height="70" rx="8" fill="#30353d" stroke="#4a515b" stroke-width="1"/>
  <line x2="74" y2="90" x1="104" y1="90" stroke="#f2b134" stroke-width="2.5"/>
  <text x="112" y="94" fill="#f2d38a" font-size="11">Merkle path binding H(w,m)</text>
  <line x2="74" y2="110" x1="104" y1="110" stroke="#4fb3e8" stroke-width="2.5"/>
  <text x="112" y="114" fill="#7fd1ff" font-size="11">OP_RETURN commitment</text>
  <line x2="74" y2="130" x1="104" y1="130" stroke="#9aa4b2" stroke-width="2.5"/>
  <text x="112" y="134" fill="#c7cdd6" font-size="11">standard hashing links</text>
</svg>
