<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="900" height="420" fill="#2b2f33"/>

  <!-- Title -->
  <text x="450" y="45" fill="#f5f5f5" font-size="26" font-weight="bold" text-anchor="middle">Knowledge Asymmetry under Quantum Attack</text>

  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrowGrey" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#cccccc"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4caf50"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e5534b"/>
    </marker>
  </defs>

  <!-- ================= FORWARD DIRECTION (top row) ================= -->
  <text x="450" y="95" fill="#9aa0a6" font-size="15" text-anchor="middle" font-style="italic">Forward derivation (easy, classical)</text>

  <!-- Secret preimage box -->
  <rect x="40" y="130" width="200" height="90" rx="10" fill="#3a3f45" stroke="#f5c542" stroke-width="2.5"/>
  <text x="140" y="165" fill="#f5c542" font-size="16" font-weight="bold" text-anchor="middle">Knowledge Asymmetry</text>
  <text x="140" y="190" fill="#d0d0d0" font-size="13" text-anchor="middle">(preimage / seed)</text>
  <text x="140" y="208" fill="#9aa0a6" font-size="12" text-anchor="middle">"correct horse..."</text>

  <!-- Secret key box -->
  <rect x="350" y="130" width="200" height="90" rx="10" fill="#3a3f45" stroke="#5b9bd5" stroke-width="2.5"/>
  <text x="450" y="170" fill="#5b9bd5" font-size="18" font-weight="bold" text-anchor="middle">Secret Key</text>
  <text x="450" y="195" fill="#9aa0a6" font-size="12" text-anchor="middle">256-bit scalar k</text>

  <!-- Public key box -->
  <rect x="660" y="130" width="200" height="90" rx="10" fill="#3a3f45" stroke="#a06cd5" stroke-width="2.5"/>
  <text x="760" y="170" fill="#a06cd5" font-size="18" font-weight="bold" text-anchor="middle">Public Key</text>
  <text x="760" y="195" fill="#9aa0a6" font-size="12" text-anchor="middle">point P = k·G</text>

  <!-- Forward arrows -->
  <line x1="245" y1="175" x2="345" y2="175" stroke="#cccccc" stroke-width="2.5" marker-end="url(#arrowGrey)"/>
  <text x="295" y="143" fill="#e0e0e0" font-size="12" text-anchor="middle">One-way function</text>
  <text x="295" y="163" fill="#e0e0e0" font-size="12" text-anchor="middle">(e.g. SHA-256)</text>

  <line x1="555" y1="175" x2="655" y2="175" stroke="#cccccc" stroke-width="2.5" marker-end="url(#arrowGrey)"/>
  <text x="605" y="163" fill="#e0e0e0" font-size="12" text-anchor="middle">EC multiply</text>

  <!-- ================= REVERSE DIRECTION (bottom row) ================= -->

  <!-- Quantum icon / label -->
  <rect x="360" y="280" width="180" height="55" rx="10" fill="#1f2327" stroke="#7fd4ff" stroke-width="2"/>
  <text x="450" y="310" fill="#7fd4ff" font-size="15" font-weight="bold" text-anchor="middle">Quantum Computer</text>

  <!-- POSSIBLE: Public key -> Secret key (green) -->
  <path d="M660,205 C560,270 560,270 553,213" fill="none" stroke="#4caf50" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="680" y="270" fill="#4caf50" font-size="15" font-weight="bold" text-anchor="middle">✓ CAN invert</text>
  <text x="675" y="292" fill="#d0d0d0" font-size="12.5" text-anchor="middle">Solves elliptic-curve discrete log:</text>
  <text x="675" y="308" fill="#d0d0d0" font-size="12.5" text-anchor="middle">recovers Secret Key from Public Key</text>
  <line x1="560" y1="345" x2="655" y2="215" stroke="#4caf50" stroke-width="0"/>

  <!-- IMPOSSIBLE: Secret key -> Secret (red, blocked) -->
  <path d="M350,205 C250,270 250,270 243,213" fill="none" stroke="#e5534b" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrowRed)"/>
  <text x="220" y="280" fill="#e5534b" font-size="15" font-weight="bold" text-anchor="middle">✗ CANNOT invert</text>
  <text x="220" y="302" fill="#d0d0d0" font-size="12.5" text-anchor="middle">Hash is one-way; no efficient</text>
  <text x="220" y="318" fill="#d0d0d0" font-size="12.5" text-anchor="middle">quantum preimage attack exists</text>

  <!-- Barrier symbol on hash inversion -->
  <text x="295" y="255" fill="#e5534b" font-size="22" font-weight="bold" text-anchor="middle">⛔</text>

</svg>
