<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="900" height="720" fill="#2b2f33"/>

  <!-- Title -->
  <text x="450" y="42" fill="#f5f5f5" font-size="26" font-weight="bold" text-anchor="middle">FawkesCoin Commit / Reveal Signing Protocol</text>
  <line x1="120" y1="58" x2="780" y2="58" stroke="#555b60" stroke-width="1"/>

  <!-- ===================== SETUP SECTION ===================== -->
  <text x="60" y="100" fill="#7fd1ff" font-size="18" font-weight="bold">1 · Setup (Key Generation)</text>

  <!-- secret x -->
  <rect x="70" y="120" width="150" height="60" rx="10" fill="#3a4046" stroke="#ff6b6b" stroke-width="2"/>
  <text x="145" y="145" fill="#ff6b6b" font-size="15" font-weight="bold" text-anchor="middle">secret preimage</text>
  <text x="145" y="168" fill="#f5f5f5" font-size="18" text-anchor="middle" font-style="italic">x</text>

  <!-- public y -->
  <rect x="300" y="120" width="180" height="60" rx="10" fill="#3a4046" stroke="#7CFFA0" stroke-width="2"/>
  <text x="390" y="145" fill="#7CFFA0" font-size="15" font-weight="bold" text-anchor="middle">public key / address</text>
  <text x="390" y="168" fill="#f5f5f5" font-size="18" text-anchor="middle" font-style="italic">y = H(x)</text>

  <!-- arrows setup -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <line x1="220" y1="150" x2="298" y2="150" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500" y="155" fill="#7CFFA0" font-size="14">↠ published</text>

  <line x1="120" y1="205" x2="780" y2="205" stroke="#555b60" stroke-width="1"/>

  <!-- ===================== SIGNING SECTION ===================== -->
  <text x="60" y="240" fill="#7fd1ff" font-size="18" font-weight="bold">2 · Signing a message m  (three steps)</text>

  <!-- Step A: commit -->
  <rect x="70" y="265" width="220" height="90" rx="10" fill="#3a4046" stroke="#ffd166" stroke-width="2"/>
  <text x="180" y="290" fill="#ffd166" font-size="15" font-weight="bold" text-anchor="middle">Step A — Commit</text>
  <text x="180" y="316" fill="#f5f5f5" font-size="13" text-anchor="middle">publish commitment</text>
  <text x="180" y="340" fill="#ffd166" font-size="18" text-anchor="middle" font-style="italic">H(x, m)</text>

  <!-- Step B: wait -->
  <rect x="335" y="265" width="220" height="90" rx="10" fill="#3a4046" stroke="#c58cff" stroke-width="2"/>
  <text x="445" y="290" fill="#c58cff" font-size="15" font-weight="bold" text-anchor="middle">Step B — Wait</text>
  <text x="445" y="316" fill="#f5f5f5" font-size="13" text-anchor="middle">a few blocks, until H(x,m)</text>
  <text x="445" y="336" fill="#f5f5f5" font-size="13" text-anchor="middle">cannot be reorged out</text>

  <!-- Step C: reveal -->
  <rect x="600" y="265" width="220" height="90" rx="10" fill="#3a4046" stroke="#ff9e64" stroke-width="2"/>
  <text x="710" y="290" fill="#ff9e64" font-size="15" font-weight="bold" text-anchor="middle">Step C — Reveal</text>
  <text x="710" y="316" fill="#f5f5f5" font-size="13" text-anchor="middle">publish reveal</text>
  <text x="710" y="340" fill="#ff9e64" font-size="18" text-anchor="middle" font-style="italic">(x , m)</text>

  <!-- arrows between steps -->
  <line x1="290" y1="310" x2="333" y2="310" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="555" y1="310" x2="598" y2="310" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="120" y1="385" x2="780" y2="385" stroke="#555b60" stroke-width="1"/>

  <!-- ===================== BLOCKCHAIN ===================== -->
  <text x="60" y="420" fill="#7fd1ff" font-size="18" font-weight="bold">On-chain view</text>

  <!-- chain blocks -->
  <g>
    <rect x="70"  y="440" width="110" height="70" rx="6" fill="#40474d" stroke="#8a9097"/>
    <text x="125" y="470" fill="#c9c9c9" font-size="12" text-anchor="middle">block N</text>
    <text x="125" y="492" fill="#ffd166" font-size="14" text-anchor="middle" font-style="italic">H(x,m)</text>

    <rect x="210" y="440" width="110" height="70" rx="6" fill="#40474d" stroke="#8a9097"/>
    <text x="265" y="470" fill="#c9c9c9" font-size="12" text-anchor="middle">block N+1</text>
    <text x="265" y="492" fill="#8a9097" font-size="12" text-anchor="middle">…</text>

    <rect x="350" y="440" width="110" height="70" rx="6" fill="#40474d" stroke="#8a9097"/>
    <text x="405" y="470" fill="#c9c9c9" font-size="12" text-anchor="middle">block N+2</text>
    <text x="405" y="492" fill="#8a9097" font-size="12" text-anchor="middle">…</text>

    <rect x="490" y="440" width="110" height="70" rx="6" fill="#40474d" stroke="#8a9097"/>
    <text x="545" y="470" fill="#c9c9c9" font-size="12" text-anchor="middle">block N+k</text>
    <text x="545" y="492" fill="#ff9e64" font-size="14" text-anchor="middle" font-style="italic">(x, m)</text>

    <!-- links -->
    <line x1="180" y1="475" x2="208" y2="475" stroke="#8a9097" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="320" y1="475" x2="348" y2="475" stroke="#8a9097" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="460" y1="475" x2="488" y2="475" stroke="#8a9097" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- wait bracket -->
    <path d="M70,525 L70,533 L600,533 L600,525" fill="none" stroke="#c58cff" stroke-width="2"/>
    <text x="335" y="552" fill="#c58cff" font-size="13" text-anchor="middle">wait a few blocks before revealing</text>
  </g>

  <!-- ===================== VERIFY ===================== -->
  <line x1="120" y1="575" x2="780" y2="575" stroke="#555b60" stroke-width="1"/>
  <text x="60" y="608" fill="#7fd1ff" font-size="18" font-weight="bold">3 · Verify a reveal (x, m)</text>

  <rect x="70" y="628" width="350" height="70" rx="10" fill="#3a4046" stroke="#7CFFA0" stroke-width="2"/>
  <text x="245" y="655" fill="#7CFFA0" font-size="14" font-weight="bold" text-anchor="middle">Check</text>
  <text x="245" y="680" fill="#f5f5f5" font-size="16" text-anchor="middle" font-style="italic">H(x) = y</text>

  <rect x="480" y="628" width="350" height="70" rx="10" fill="#3a4046" stroke="#7CFFA0" stroke-width="2"/>
  <text x="655" y="655" fill="#7CFFA0" font-size="14" font-weight="bold" text-anchor="middle">Check</text>
  <text x="655" y="680" fill="#f5f5f5" font-size="16" text-anchor="middle" font-style="italic">H(x, m) present on-chain</text>

  <text x="450" y="668" fill="#7CFFA0" font-size="20" text-anchor="middle" font-weight="bold">✓</text>
</svg>
